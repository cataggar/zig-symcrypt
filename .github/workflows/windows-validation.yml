name: Windows validation

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }} dynamic/static native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows-msvc
            arch: x86_64
            runner: windows-2022
          - target: aarch64-windows-msvc
            arch: aarch64
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: microsoft/SymCrypt
          ref: 286762b7730e2b780678f5ab11fef2b1bad639e0
          path: .symcrypt-ci-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Use provenance-checked x86-64 Zig under Arm64 emulation
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $directory = "$env:GITHUB_WORKSPACE/.tools/zig-x86_64"
          $archive = "$env:GITHUB_WORKSPACE/.tools/zig-x86_64-windows-0.16.0.zip"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.tools" | Out-Null
          Invoke-WebRequest `
            -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          if ($actual -ne $expected) {
            throw "x86-64 Zig archive SHA-256 mismatch: found $actual, expected $expected"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $bin = Join-Path $directory "zig-x86_64-windows-0.16.0"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build immutable pinned fixtures
        shell: pwsh
        run: |
          ./tools/build-windows-fixtures.ps1 `
            -Source "$env:GITHUB_WORKSPACE/.symcrypt-ci-source" `
            -Output "$env:GITHUB_WORKSPACE/.symcrypt-ci/${{ matrix.arch }}" `
            -Architecture "${{ matrix.arch }}"
      - name: Verify and execute complete dynamic matrix
        shell: pwsh
        run: |
          $fixture = "$env:GITHUB_WORKSPACE/.symcrypt-ci/${{ matrix.arch }}"
          $manifest = "$fixture/provenance.json"
          $plus = "$fixture/lib/symcrypt_plus_NoCIL.lib"
          $core = "$fixture/dll/symcrypt_zig_103_13.lib"
          $env:Path = "$fixture/dll;$env:Path"
          zig build abi-release-gate `
            -Dtarget=${{ matrix.target }} `
            -Dlinkage=dynamic `
            -Dsymcrypt_provenance="$manifest" `
            -Dsymcrypt_libraries="$plus" `
            -Dsymcrypt_libraries="$core" `
            --summary all
          if ($LASTEXITCODE -ne 0) { throw "dynamic ABI release gate failed" }
          zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=dynamic -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" `
            --summary all
          if ($LASTEXITCODE -ne 0) { throw "dynamic ReleaseSafe tests failed" }
          foreach ($optimize in @("Debug", "ReleaseSafe")) {
            zig build test -Dtarget=${{ matrix.target }} -Doptimize=$optimize `
              -Dlinkage=dynamic -Dlegacy=true `
              -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" --summary all
            if ($LASTEXITCODE -ne 0) { throw "dynamic legacy $optimize tests failed" }
            zig build test -Dtarget=${{ matrix.target }} -Doptimize=$optimize `
              -Dlinkage=dynamic -Dlegacy=true `
              -Denable_legacy_rsa_pkcs1_encryption=true `
              -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" --summary all
            if ($LASTEXITCODE -ne 0) { throw "dynamic legacy RSA $optimize tests failed" }
          }
          zig build example -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=dynamic -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core"
          if ($LASTEXITCODE -ne 0) { throw "dynamic examples failed" }
          zig build consumer-example -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=dynamic -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core"
          if ($LASTEXITCODE -ne 0) { throw "dynamic consumer failed" }
      - name: Verify and execute complete static matrix
        shell: pwsh
        run: |
          $fixture = "$env:GITHUB_WORKSPACE/.symcrypt-ci/${{ matrix.arch }}"
          $manifest = "$fixture/provenance.json"
          $plus = "$fixture/lib/symcrypt_plus_NoCIL.lib"
          $core = "$fixture/lib/symcrypt_static_NoCIL.lib"
          zig build abi-release-gate `
            -Dtarget=${{ matrix.target }} `
            -Dlinkage=static `
            -Dsymcrypt_provenance="$manifest" `
            -Dsymcrypt_libraries="$plus" `
            -Dsymcrypt_libraries="$core" `
            --summary all
          if ($LASTEXITCODE -ne 0) { throw "static ABI release gate failed" }
          zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=static -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" `
            --summary all
          if ($LASTEXITCODE -ne 0) { throw "static ReleaseSafe tests failed" }
          foreach ($optimize in @("Debug", "ReleaseSafe")) {
            zig build test -Dtarget=${{ matrix.target }} -Doptimize=$optimize `
              -Dlinkage=static -Dlegacy=true `
              -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" --summary all
            if ($LASTEXITCODE -ne 0) { throw "static legacy $optimize tests failed" }
            zig build test -Dtarget=${{ matrix.target }} -Doptimize=$optimize `
              -Dlinkage=static -Dlegacy=true `
              -Denable_legacy_rsa_pkcs1_encryption=true `
              -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core" --summary all
            if ($LASTEXITCODE -ne 0) { throw "static legacy RSA $optimize tests failed" }
          }
          zig build example -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=static -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core"
          if ($LASTEXITCODE -ne 0) { throw "static examples failed" }
          zig build consumer-example -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe `
            -Dlinkage=static -Dsymcrypt_libraries="$plus" -Dsymcrypt_libraries="$core"
          if ($LASTEXITCODE -ne 0) { throw "static consumer failed" }

  abi:
    name: FRE and checked header ABI matrix
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Compile all pinned public and checked ABI canaries
        shell: pwsh
        run: |
          zig build abi -Dheaders_only=true --summary all
          if ($LASTEXITCODE -ne 0) { throw "full FRE/checked ABI matrix failed" }
